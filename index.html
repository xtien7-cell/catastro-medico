<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2c3e50">
<title>Catastro Médico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
* { -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; margin: 0; background: #2c3e50; overflow: hidden; user-select: none; }

#toolbar { background: #34495e; color: white; padding: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#toolbar button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
.btn-crear { background: #3498db; }
.btn-nomen { background: #f39c12; }
.btn-editar { background: #27ae60; }
.btn-fijar { background: #e74c3c; }
.btn-eliminar { background: #c0392b; }
.btn-zoom { background: #16a085; min-width: 40px; }
#zoom-info { font-size: 12px; font-weight: bold; padding: 0 8px; }
#estado { margin-left: auto; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 4px; }

#sidebar { position: fixed; left: 0; top: 50px; width: 260px; height: calc(100vh - 50px); background: white; overflow-y: auto; border-right: 2px solid #bdc3c7; z-index: 90; }
.seccion { border-bottom: 2px solid #bdc3c7; }
.seccion-titulo { background: #2c3e50; color: white; padding: 14px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; }
.seccion-titulo.naranja { background: #d35400; }
.seccion-contenido { display: none; padding: 12px; }
.seccion-contenido.abierto { display: block; }
.seccion-contenido label { display: block; font-size: 12px; font-weight: bold; color: #2c3e50; margin: 8px 0 4px 0; }
.seccion-contenido input, .seccion-contenido select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 13px; }
.seccion-contenido button { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; color: white; }
.b-verde { background: #27ae60; }
.b-rojo { background: #e74c3c; }
.b-azul { background: #3498db; }
.b-naranja { background: #d35400; }
.b-morado { background: #8e44ad; }
.info-box { font-size: 11px; padding: 10px; border-radius: 4px; margin-top: 8px; text-align: center; font-weight: bold; background: #ecf0f1; color: #2c3e50; }
.info-box.ok { background: #d4edda; color: #155724; }
.info-box.error { background: #f8d7da; color: #721c24; }
.lista { max-height: 200px; overflow-y: auto; border: 1px solid #bdc3c7; border-radius: 4px; background: #f8f9fa; margin-top: 8px; }
.item-lista { padding: 10px; border-bottom: 1px solid #ecf0f1; cursor: pointer; font-size: 13px; }
.item-lista:hover { background: #ecf0f1; }
.item-lista.activo { background: #d35400; color: white; font-weight: bold; }

#mapa-wrapper { position: fixed; left: 260px; top: 50px; right: 0; bottom: 0; overflow: auto; background: #bdc3c7; padding: 20px; }
#canvas-container { position: relative; display: inline-block; }
#mapa-img { display: block; }
#canvas-zoom-container { position: absolute; top: 0; left: 0; transform-origin: top left; }

#mensaje-centro { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 12px; text-align: center; color: #7f8c8d; z-index: 5; max-width: 90%; }
#mensaje-centro h2 { color: #d35400; margin-top: 0; }

#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto; }
#modal.abierto { display: block; }
.modal-box { background: white; max-width: 800px; margin: 20px auto; padding: 20px; border-radius: 10px; position: relative; }
.modal-box h2 { margin-top: 0; font-size: 18px; }
.cerrar { position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; color: #aaa; background: none; border: none; font-weight: bold; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.form-group { flex: 1; min-width: 130px; display: flex; flex-direction: column; }
.form-group label { font-size: 11px; font-weight: bold; color: #7f8c8d; margin-bottom: 3px; }
.form-group input, .form-group select, .form-group textarea { padding: 8px; border: 1px solid #bdc3c7; border-radius: 4px; font-size: 13px; font-family: inherit; }
.tarjeta { border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 12px; position: relative; }
.btn-x { position: absolute; top: 8px; right: 8px; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2c3e50; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none; }
#toast.ver { opacity: 1; }
#toast.ok { background: #27ae60; }
#toast.err { background: #e74c3c; }

@media (max-width: 768px) {
  #sidebar { width: 100%; left: -100%; transition: 0.3s; z-index: 200; }
  #sidebar.abierto { left: 0; }
  #mapa-wrapper { left: 0; }
  #btn-menu { display: block !important; }
}
#btn-menu { display: none; }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-menu" onclick="toggleMenu()">☰</button>
  <button class="btn-crear" onclick="crearCasa()">➕ Casa</button>
  <button class="btn-nomen" onclick="ponerNomenclatura()">✍️ Nomen</button>
  <button class="btn-editar" onclick="modoEdicion()">🖱️ Editar</button>
  <button class="btn-fijar" onclick="fijarCasas()">📌 Fijar</button>
  <button class="btn-eliminar" onclick="eliminarSeleccionado()">🗑️ Borrar</button>
  <button class="btn-zoom" onclick="cambiarZoom(-0.2)">➖</button>
  <span id="zoom-info">100%</span>
  <button class="btn-zoom" onclick="cambiarZoom(0.2)">➕</button>
  <button class="btn-zoom" onclick="resetZoom()">🔄</button>
  <span id="estado">📍 Sin barrio</span>
</div>

<div id="sidebar">
  <!-- EQUIPO -->
  <div class="seccion">
    <div class="seccion-titulo naranja" onclick="toggleSeccion('sec-equipo')">
      <span>🏥 Equipo de Salud</span><span id="flecha-equipo">▼</span>
    </div>
    <div class="seccion-contenido abierto" id="sec-equipo">
      <div class="info-box" id="equipo-activo">Sin equipo</div>
      <label>Nombre del equipo:</label>
      <input type="text" id="nuevo-equipo" placeholder="Ej: EU01, EU02">
      <button class="b-naranja" onclick="crearEquipo()">➕ CREAR EQUIPO</button>
      <label>Mis equipos:</label>
      <div class="lista" id="lista-equipos"></div>
      <button class="b-rojo" onclick="eliminarEquipoActual()">🗑️ Eliminar equipo actual</button>
    </div>
  </div>

  <!-- NUBE -->
  <div class="seccion">
    <div class="seccion-titulo" onclick="toggleSeccion('sec-nube')">
      <span>☁️ Nube (Google)</span><span id="flecha-nube">▼</span>
    </div>
    <div class="seccion-contenido" id="sec-nube">
      <button class="b-azul" id="btn-google" onclick="conectarGoogle()">🔗 Conectar con Google</button>
      <div class="info-box" id="estado-nube">Sin conectar</div>
      <button class="b-verde" onclick="subirNube()">⬆️ SUBIR TODO</button>
      <button class="b-naranja" onclick="bajarNube()">⬇️ BAJAR TODO</button>
    </div>
  </div>

  <!-- BARRIOS -->
  <div class="seccion">
    <div class="seccion-titulo" onclick="toggleSeccion('sec-barrios')">
      <span>📍 Barrios</span><span id="flecha-barrios">▼</span>
    </div>
    <div class="seccion-contenido" id="sec-barrios">
      <label>Barrio actual:</label>
      <select id="select-barrio" onchange="cambiarBarrio(this.value)">
        <option value="">-- Sin barrios --</option>
      </select>
      <label>Crear nuevo barrio:</label>
      <input type="text" id="nuevo-barrio" placeholder="Ej: Chorlavi">
      <label>Imagen del mapa:</label>
      <input type="file" id="archivo-mapa" accept="image/*">
      <button class="b-verde" onclick="cargarBarrio()">✅ CARGAR BARRIO</button>
      <button class="b-rojo" onclick="eliminarBarrio()">🗑️ Eliminar barrio actual</button>
      <button class="b-morado" onclick="exportarJSON()">📤 Exportar JSON</button>
      <button class="b-morado" onclick="document.getElementById('import-file').click()">📥 Importar JSON</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importarJSON(event)">
    </div>
  </div>

  <!-- PACIENTES -->
  <div class="seccion">
    <div class="seccion-titulo" onclick="toggleSeccion('sec-pacientes')">
      <span>📊 Pacientes</span><span id="flecha-pacientes">▼</span>
    </div>
    <div class="seccion-contenido" id="sec-pacientes">
      <button class="b-azul" onclick="abrirMatriz('barrio')">📍 Barrio actual</button>
      <button class="b-azul" onclick="abrirMatriz('eais')">🏥 Todo mi EAIS</button>
      <button class="b-morado" onclick="abrirMatriz('total')">🌎 TODOS los EAIS</button>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="seccion">
    <div class="seccion-titulo" onclick="toggleSeccion('sec-filtros')">
      <span>🔍 Filtrar</span><span id="flecha-filtros">▼</span>
    </div>
    <div class="seccion-contenido" id="sec-filtros">
      <label><input type="checkbox" value="Embarazada" onchange="aplicarFiltros()"> Embarazada</label>
      <label><input type="checkbox" value="Niños menores de 2 años" onchange="aplicarFiltros()"> Niños &lt; 2 años</label>
      <label><input type="checkbox" value="Discapacidad" onchange="aplicarFiltros()"> Discapacidad</label>
      <label><input type="checkbox" value="Hipertensión" onchange="aplicarFiltros()"> Hipertensión</label>
      <label><input type="checkbox" value="Diabetes" onchange="aplicarFiltros()"> Diabetes</label>
      <label><input type="checkbox" value="Salud mental" onchange="aplicarFiltros()"> Salud mental</label>
      <label><input type="checkbox" value="VIH" onchange="aplicarFiltros()"> VIH</label>
      <label><input type="checkbox" value="Tuberculosis" onchange="aplicarFiltros()"> Tuberculosis</label>
      <label><input type="checkbox" value="Desnutrición" onchange="aplicarFiltros()"> Desnutrición</label>
      <label><input type="checkbox" value="Vacunas incompletas" onchange="aplicarFiltros()"> Vacunas incompletas</label>
      <label><input type="checkbox" value="Evento de salud" onchange="aplicarFiltros()"> Evento de salud</label>
      <label><input type="checkbox" value="Cuidados paliativos" onchange="aplicarFiltros()"> Cuidados paliativos</label>
      <button class="b-rojo" onclick="limpiarFiltros()">Limpiar filtros</button>
    </div>
  </div>
</div>

<div id="mapa-wrapper">
  <div id="mensaje-centro">
    <h2>🏥 Selecciona un Equipo</h2>
    <p>Abre "Equipo de Salud" en el menú izquierdo</p>
    <p>y crea uno (ej: EU01).</p>
  </div>
  <div id="canvas-container" style="display:none;">
    <img id="mapa-img" src="" alt="">
    <div id="canvas-zoom-container">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</div>

<div id="modal">
  <div class="modal-box">
    <button class="cerrar" onclick="cerrarModal()">×</button>
    <h2 id="modal-titulo">Ficha</h2>
    <div id="modal-contenido"></div>
    <div style="margin-top:15px; display:flex; gap:10px;">
      <button class="b-azul" style="flex:1;" onclick="agregarIntegrante()">+ Integrante</button>
      <button class="b-verde" style="flex:1;" onclick="guardarFicha()">💾 Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ==================== CONFIG ====================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA9ZDzrw1PFfQ49zom9uyvymz4uUh5Alzg",
  authDomain: "catastro-medico.firebaseapp.com",
  projectId: "catastro-medico",
  storageBucket: "catastro-medico.firebasestorage.app",
  messagingSenderId: "600952886375",
  appId: "1:600952886375:web:f738d3e0bfe11d28f670c2"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

// ==================== VARIABLES ====================
let canvas = null;
let equipo = null;
let barrioActual = null;
let idCasaActual = null;
let zoom = 1;
let usuario = null;
let unsubscribe = null;
let guardando = false;

// ==================== UTILS ====================
function P(k) { return 'cat_' + (equipo || 'none') + '_' + k; }
function toast(msg, tipo) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'ver ' + (tipo || '');
  setTimeout(() => { t.className = ''; }, 2500);
}
function log(msg) { console.log('[Cat] ' + msg); }

function toggleSeccion(id) {
  const el = document.getElementById(id);
  const flecha = document.getElementById('flecha-' + id.replace('sec-', ''));
  el.classList.toggle('abierto');
  if (flecha) flecha.innerText = el.classList.contains('abierto') ? '▼' : '▶';
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('abierto');
}

// ==================== EQUIPOS ====================
function listaEquipos() {
  try { return JSON.parse(localStorage.getItem('cat_equipos') || '[]'); } catch(e) { return []; }
}
function guardarEquipos(l) { localStorage.setItem('cat_equipos', JSON.stringify(l)); }

function actualizarUIEquipos() {
  const lista = listaEquipos();
  const div = document.getElementById('lista-equipos');
  const caja = document.getElementById('equipo-activo');
  
  if (lista.length === 0) {
    div.innerHTML = '<div style="padding:15px; text-align:center; color:#7f8c8d; font-size:12px;">Sin equipos</div>';
    caja.innerText = 'Sin equipo';
    caja.className = 'info-box';
    return;
  }
  
  let html = '';
  lista.forEach(e => {
    html += '<div class="item-lista ' + (e === equipo ? 'activo' : '') + '" onclick="cambiarEquipo(\'' + e + '\')">🏥 ' + e + '</div>';
  });
  div.innerHTML = html;
  
  if (equipo) {
    caja.innerText = '✅ Equipo: ' + equipo;
    caja.className = 'info-box ok';
  }
}

function crearEquipo() {
  const input = document.getElementById('nuevo-equipo');
  let nombre = input.value.trim().toUpperCase();
  if (!nombre) { toast('Escribe un nombre', 'err'); return; }
  nombre = nombre.replace(/[^A-Z0-9_]/g, '_');
  
  const lista = listaEquipos();
  if (lista.includes(nombre)) { toast('Ya existe', 'err'); return; }
  if (!confirm('Crear equipo ' + nombre + '?')) return;
  
  lista.push(nombre);
  guardarEquipos(lista);
  input.value = '';
  toast('Equipo ' + nombre + ' creado', 'ok');
  
  cambiarEquipo(nombre);
}

function cambiarEquipo(nombre) {
  if (!nombre) return;
  if (equipo === nombre) return;
  
  if (equipo && canvas) guardarCanvas();
  
  equipo = nombre;
  localStorage.setItem('cat_equipo_activo', nombre);
  barrioActual = null;
  if (canvas) canvas.clear();
  
  actualizarUIEquipos();
  actualizarSelectBarrios();
  
  log('Equipo: ' + nombre);
  
  const lista = cargarBarrios();
  if (lista.length > 0) {
    document.getElementById('mensaje-centro').style.display = 'none';
    cambiarBarrio(lista[0].id);
  } else {
    document.getElementById('mensaje-centro').style.display = 'block';
    document.getElementById('mensaje-centro').innerHTML = '<h2>📍 Sin barrios</h2><p>Crea el primer barrio en el menú izquierdo.</p>';
    document.getElementById('canvas-container').style.display = 'none';
  }
  
  document.getElementById('estado').innerText = '🏥 ' + nombre;
  
  if (usuario) {
    if (unsubscribe) unsubscribe();
    iniciarEscucha();
  }
}

function eliminarEquipoActual() {
  if (!equipo) { toast('Sin equipo', 'err'); return; }
  if (!confirm('Eliminar equipo ' + equipo + ' y TODOS sus datos?')) return;
  if (!confirm('¿Estás seguro? Esto no se puede deshacer.')) return;
  
  const prefijo = 'cat_' + equipo + '_';
  const borrar = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(prefijo)) borrar.push(k);
  }
  borrar.forEach(k => localStorage.removeItem(k));
  
  const lista = listaEquipos().filter(e => e !== equipo);
  guardarEquipos(lista);
  
  if (usuario) {
    db.collection('catastros').doc(equipo).delete().catch(e => console.log(e));
  }
  
  equipo = null;
  localStorage.removeItem('cat_equipo_activo');
  
  if (lista.length > 0) {
    cambiarEquipo(lista[0]);
  } else {
    actualizarUIEquipos();
    document.getElementById('mensaje-centro').style.display = 'block';
    document.getElementById('mensaje-centro').innerHTML = '<h2>🏥 Selecciona un Equipo</h2><p>Crea uno nuevo en el menú.</p>';
    document.getElementById('canvas-container').style.display = 'none';
    document.getElementById('estado').innerText = '📍 Sin barrio';
  }
  
  toast('Equipo eliminado', 'ok');
}

// ==================== BARRIOS ====================
function cargarBarrios() {
  if (!equipo) return [];
  try { return JSON.parse(localStorage.getItem(P('barrios')) || '[]'); } catch(e) { return []; }
}
function guardarBarrios(l) {
  if (!equipo) return;
  localStorage.setItem(P('barrios'), JSON.stringify(l));
}

function actualizarSelectBarrios() {
  const sel = document.getElementById('select-barrio');
  sel.innerHTML = '';
  const l = cargarBarrios();
  if (l.length === 0) {
    sel.innerHTML = '<option value="">-- Sin barrios --</option>';
    return;
  }
  l.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = b.nombre;
    sel.appendChild(opt);
  });
  if (barrioActual) sel.value = barrioActual.id;
}

function cargarBarrio() {
  if (!equipo) { toast('Primero crea un equipo', 'err'); return; }
  const nombre = document.getElementById('nuevo-barrio').value.trim();
  const file = document.getElementById('archivo-mapa').files[0];
  if (!nombre) { toast('Escribe un nombre', 'err'); return; }
  if (!file) { toast('Selecciona una imagen', 'err'); return; }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const max = 1200;
      let w = img.width, h = img.height;
      if (w > max) { h = Math.round(h * max / w); w = max; }
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const ctx = tmp.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const data = tmp.toDataURL('image/jpeg', 0.6);
      
      const id = 'b_' + Date.now();
      try { localStorage.setItem(P('mapa_' + id), data); }
      catch(err) { toast('Imagen muy grande', 'err'); return; }
      
      const l = cargarBarrios();
      l.push({ id, nombre });
      guardarBarrios(l);
      
      document.getElementById('nuevo-barrio').value = '';
      document.getElementById('archivo-mapa').value = '';
      
      actualizarSelectBarrios();
      cambiarBarrio(id);
      toast('Barrio ' + nombre + ' creado', 'ok');
      programarSubida();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function cambiarBarrio(id) {
  if (!id || !equipo) return;
  if (barrioActual) guardarCanvas();
  
  const l = cargarBarrios();
  const b = l.find(x => x.id === id);
  if (!b) return;
  
  barrioActual = b;
  localStorage.setItem(P('barrio_activo'), id);
  document.getElementById('select-barrio').value = id;
  document.getElementById('estado').innerText = '📍 ' + b.nombre;
  document.getElementById('mensaje-centro').style.display = 'none';
  document.getElementById('canvas-container').style.display = 'inline-block';
  
  const dataURL = localStorage.getItem(P('mapa_' + id));
  const canvasJSON = localStorage.getItem(P('canvas_' + id));
  
  if (!dataURL) { toast('Sin imagen', 'err'); return; }
  
  const img = new Image();
  img.onload = function() {
    const mImg = document.getElementById('mapa-img');
    mImg.src = dataURL;
    mImg.width = img.width;
    mImg.height = img.height;
    
    canvas.setWidth(img.width);
    canvas.setHeight(img.height);
    canvas.setBackgroundColor(null, canvas.renderAll.bind(canvas));
    canvas.setZoom(1);
    
    if (canvasJSON) {
      try {
        canvas.loadFromJSON(canvasJSON, function() {
          canvas.forEachObject(function(o) {
            if (o.type === 'group') {
              o.selectable = false;
              o.evented = true;
              o.hasControls = false;
              o.hasBorders = false;
              o.hoverCursor = 'pointer';
              o.setCoords();
            }
          });
          canvas.renderAll();
          canvas.calcOffset();
        });
      } catch(e) { canvas.renderAll(); }
    } else {
      canvas.clear();
      canvas.setWidth(img.width);
      canvas.setHeight(img.height);
      canvas.renderAll();
    }
    setTimeout(() => { canvas.calcOffset(); canvas.renderAll(); }, 100);
  };
  img.src = dataURL;
}

function eliminarBarrio() {
  if (!barrioActual) { toast('Sin barrio', 'err'); return; }
  if (!confirm('Eliminar barrio ' + barrioActual.nombre + '?')) return;
  
  const id = barrioActual.id;
  localStorage.removeItem(P('mapa_' + id));
  localStorage.removeItem(P('canvas_' + id));
  
  const borrar = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.startsWith(P('ficha_' + id + '_')) || k.startsWith(P('estado_' + id + '_')))) {
      borrar.push(k);
    }
  }
  borrar.forEach(k => localStorage.removeItem(k));
  
  const l = cargarBarrios().filter(b => b.id !== id);
  guardarBarrios(l);
  actualizarSelectBarrios();
  
  barrioActual = null;
  canvas.clear();
  document.getElementById('canvas-container').style.display = 'none';
  document.getElementById('mensaje-centro').style.display = 'block';
  document.getElementById('mensaje-centro').innerHTML = '<h2>📍 Sin barrios</h2><p>Crea uno nuevo.</p>';
  document.getElementById('estado').innerText = '🏥 ' + equipo;
  
  toast('Barrio eliminado', 'ok');
  programarSubida();
}

// ==================== SUBIR / BAJAR ====================
function recolectar() {
  if (!equipo) return { datos: {}, barrios: [] };
  const datos = {
    version: '1.0',
    fecha: new Date().toISOString(),
    equipo: equipo,
    barrios: cargarBarrios(),
    barrioActivo: barrioActual ? barrioActual.id : null,
    datos: {}
  };
  const pref = P('');
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(pref)) {
      const sinPref = k.substring(pref.length);
      if (/^(mapa_|canvas_|ficha_|estado_)/.test(sinPref)) {
        datos.datos[sinPref] = localStorage.getItem(k);
      }
    }
  }
  return datos;
}

function restaurar(datos) {
  if (!datos || !datos.datos || !datos.barrios) throw new Error('Datos inválidos');
  if (!equipo) throw new Error('Sin equipo');
  
  const pref = P('');
  const borrar = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(pref)) borrar.push(k);
  }
  borrar.forEach(k => localStorage.removeItem(k));
  
  for (const [k, v] of Object.entries(datos.datos)) {
    localStorage.setItem(P(k), v);
  }
  localStorage.setItem(P('barrios'), JSON.stringify(datos.barrios));
  if (datos.barrioActivo) localStorage.setItem(P('barrio_activo'), datos.barrioActivo);
}

async function subirNube(silencioso) {
  if (!equipo) { if (!silencioso) toast('Sin equipo', 'err'); return; }
  if (!usuario) { if (!silencioso) toast('Conecta con Google', 'err'); return; }
  if (guardando) return;
  
  if (!silencioso && !confirm('Subir equipo ' + equipo + ' a la nube?')) return;
  
  try {
    guardando = true;
    await db.collection('catastros').doc(equipo).set(recolectar());
    if (!silencioso) toast('✅ Subido', 'ok');
    document.getElementById('estado-nube').innerText = '✅ Subido: ' + new Date().toTimeString().substring(0,5);
    document.getElementById('estado-nube').className = 'info-box ok';
    setTimeout(() => { guardando = false; }, 2000);
  } catch(e) {
    guardando = false;
    if (!silencioso) toast('❌ ' + e.message, 'err');
  }
}

async function bajarNube() {
  if (!equipo) { toast('Sin equipo', 'err'); return; }
  if (!usuario) { toast('Conecta con Google', 'err'); return; }
  if (!confirm('Esto reemplazará los datos locales.\n\n¿Continuar?')) return;
  
  try {
    const doc = await db.collection('catastros').doc(equipo).get();
    if (!doc.exists) { toast('Sin datos en la nube', 'err'); return; }
    restaurar(doc.data());
    toast('Bajado. Recargando...', 'ok');
    setTimeout(() => location.reload(), 1000);
  } catch(e) { toast('❌ ' + e.message, 'err'); }
}

function programarSubida() {
  if (!equipo || !usuario) return;
  clearTimeout(window._subTimer);
  window._subTimer = setTimeout(() => subirNube(true), 3000);
}

// ==================== TIEMPO REAL ====================
function iniciarEscucha() {
  if (!usuario || !equipo) return;
  if (unsubscribe) unsubscribe();
  
  log('Escuchando: ' + equipo);
  unsubscribe = db.collection('catastros').doc(equipo).onSnapshot(function(snap) {
    if (guardando) return;
    if (!snap.exists) return;
    const remote = snap.data();
    const local = recolectar();
    if (JSON.stringify(remote.datos || {}) === JSON.stringify(local.datos || {})) return;
    
    log('Cambios externos');
    if (confirm('Hay cambios de tus compañeros.\n\n¿Bajar datos?')) {
      restaurar(remote);
      location.reload();
    }
  });
}

function guardarCanvas() {
  if (!barrioActual || !canvas || !equipo) return;

    localStorage.setItem(P('canvas_' + barrioActual.id), JSON.stringify(canvas.toJSON(['idCasa'])));
  } catch(e) {}

function guardarMapa() {
  guardarCanvas();

}

function crearCasa() {
  if (!canvas || !barrioActual || !equipo) { toast('Selecciona barrio', 'err'); return; }
  
  const wrapper = document.getElementById('mapa-wrapper');
  const cont = document.getElementById('canvas-container');
  const rw = wrapper.getBoundingClientRect();
  const rc = cont.getBoundingClientRect();
  const cx = (rw.left + rw.width/2 - rc.left) / zoom;
  const cy = (rw.top + rw.height/2 - rc.top) / zoom;
  
  const ancho = 60 / zoom;
  const alto = 50 / zoom;
  const fuente = 12 / zoom;
  
  const rect = new fabric.Rect({
    width: ancho, height: alto,
    fill: 'rgba(231, 76, 60, 0.5)', stroke: '#c0392b',
    strokeWidth: 2/zoom, rx: 5/zoom, ry: 5/zoom
  });
  const txt = new fabric.Textbox('', {
    fontSize: fuente, fill: '#2c3e50', textAlign: 'center',
    width: ancho, top: alto * 0.3, left: 0, fontWeight: 'bold'
  });
  const g = new fabric.Group([rect, txt], {
    left: cx - ancho/2, top: cy - alto/2,
    hasControls: true, hasBorders: true, selectable: true, evented: true
  });
  g.set('idCasa', 'nueva_' + Date.now());
  g.setCoords();
  canvas.add(g);
  canvas.setActiveObject(g);
  canvas.renderAll();
  guardarMapa();
  toast('Casa creada', 'ok');
}

function ponerNomenclatura() {
  const o = canvas.getActiveObject();
  if (!o || o.type !== 'group') { toast('Selecciona una casa', 'err'); return; }
  const n = prompt('Nomenclatura (ej: MZ14-C15):');
  if (n && n.trim()) {
    const t = o._objects.find(x => x.type === 'textbox' || x.type === 'text');
    if (t) t.set('text', n);
    o.set('idCasa', n);
    o.setCoords();
    canvas.renderAll();
    guardarMapa();
  }
}

function modoEdicion() {
  canvas.discardActiveObject();
  canvas.selection = true;
  canvas.forEachObject(function(o) {
    if (o.type === 'group') {
      o.selectable = true; o.evented = true;
      o.hasControls = true; o.hasBorders = true;
      o.lockMovementX = false; o.lockMovementY = false;
      o.hoverCursor = 'move';
      o.setCoords();
    }
  });
  canvas.renderAll();
  toast('Modo edición', 'ok');
}

function fijarCasas() {
  canvas.discardActiveObject();
  canvas.selection = false;
  canvas.forEachObject(function(o) {
    if (o.type === 'group') {
      o.selectable = false; o.evented = true;
      o.hasControls = false; o.hasBorders = false;
      o.lockMovementX = true; o.lockMovementY = true;
      o.hoverCursor = 'pointer';
      o.setCoords();
    }
  });
  canvas.renderAll();
  guardarMapa();
  toast('Fijadas', 'ok');
}

function eliminarSeleccionado() {
  const o = canvas.getActiveObject();
  if (!o) { toast('Selecciona algo', 'err'); return; }
  let id = null;
  if (o.type === 'group' && o.idCasa) id = o.idCasa;
  if (!confirm('¿Eliminar?')) return;
  if (id) {
    localStorage.removeItem(P('ficha_' + barrioActual.id + '_' + id));
    localStorage.removeItem(P('estado_' + barrioActual.id + '_' + id));
  }
  canvas.remove(o);
  canvas.discardActiveObject();
  canvas.renderAll();
  guardarMapa();
}

canvas = new fabric.Canvas('canvas', {
  selection: true,
  preserveObjectStacking: true,
  backgroundColor: 'transparent'
});

canvas.on('object:modified', guardarMapa);
canvas.on('object:added', function() { programarSubida(); });
canvas.on('object:removed', function() { programarSubida(); });
canvas.on('mouse:down', function(opt) {

  if (t && t.type === 'group' && t.selectable === false && t.idCasa) {

});

// ==================== ZOOM ====================
function cambiarZoom(d) {
  zoom = Math.max(0.3, Math.min(3, zoom + d));
  aplicarZoom();
}
function resetZoom() { zoom = 1; aplicarZoom(); }
function aplicarZoom() {
  document.getElementById('canvas-zoom-container').style.transform = 'scale(' + zoom + ')';
  document.getElementById('zoom-info').innerText = Math.round(zoom * 100) + '%';
}

function guardarFicha() {
  if (!idCasaActual || !barrioActual) return;
  const arr = [];
  document.querySelectorAll('#modal-contenido .tarjeta').forEach(t => {
    const n = t.querySelector('.i-nombre').value.trim();
    if (n !== '') {
      const cond = [];
      t.querySelectorAll('.i-cond:checked').forEach(cb => cond.push(cb.value));
      arr.push({
        nombre: n,
        cedula: t.querySelector('.i-cedula').value.trim(),
        edad: t.querySelector('.i-edad').value.trim(),
        sexo: t.querySelector('.i-sexo').value,
        contacto: t.querySelector('.i-contacto').value.trim(),
        enfermedades: t.querySelector('.i-enfermedades').value.trim(),
        medicamentos: t.querySelector('.i-medicamentos').value.trim(),
        condiciones: cond
      });
    }
  });
  localStorage.setItem(P('ficha_' + barrioActual.id + '_' + idCasaActual), JSON.stringify(arr));
  toast('✅ Guardada', 'ok');
  cerrarModal();
  programarSubida();
}

// ==================== FILTROS ====================
function aplicarFiltros() {
  if (!canvas) return;
  const act = [];
  document.querySelectorAll('#sec-filtros input:checked').forEach(cb => act.push(cb.value));
  canvas.forEachObject(function(o) {
    if (o.type !== 'group' || !o.idCasa || !barrioActual) return;
    let match = null;
    if (act.length > 0) {
      const dat = localStorage.getItem(P('ficha_' + barrioActual.id + '_' + o.idCasa));
      if (dat) {
        const arr = JSON.parse(dat);
        for (let i of arr) {
          if (i.condiciones) {
            for (let c of i.condiciones) {
              if (act.includes(c)) { match = c; break; }
            }
          }
          if (match) break;
        }
      }
    }
    const rect = o._objects.find(x => x.type === 'rect');
    if (match) {
      o.set('opacity', 1);
      if (rect) rect.set('strokeWidth', 4/zoom);
    } else if (act.length > 0) {
      o.set('opacity', 0.15);
      if (rect) rect.set('strokeWidth', 2/zoom);
    } else {
      o.set('opacity', 1);
      if (rect) rect.set('strokeWidth', 2/zoom);
    }
  });
  canvas.renderAll();
}

function limpiarFiltros() {
  document.querySelectorAll('#sec-filtros input').forEach(cb => cb.checked = false);
  aplicarFiltros();
}

// ==================== MATRIZ ====================
function obtenerPacientesDeBarrio(idB, nombreB) {
  if (!equipo) return [];
  const arr = [];
  const pref = P('ficha_' + idB + '_');
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(pref)) {
      const idCasa = k.substring(pref.length);
      const est = localStorage.getItem(P('estado_' + idB + '_' + idCasa)) || 'Pendiente';
      try {
        const integ = JSON.parse(localStorage.getItem(k) || '[]');
        integ.forEach(p => {
          arr.push(Object.assign({ equipo: equipo, barrio: nombreB, casa: idCasa, estado: est }, p));
        });
      } catch(e) {}
    }
  }
  return arr;
}

function obtenerPacientesEquipo() {
  if (!equipo) return [];
  const l = cargarBarrios();
  let todos = [];
  l.forEach(b => { todos = todos.concat(obtenerPacientesDeBarrio(b.id, b.nombre)); });
  return todos;
}

async function obtenerPacientesTodos() {
  if (!usuario) { toast('Conecta con Google', 'err'); return []; }
  try {
    toast('Leyendo todos los equipos...', '');
    const snap = await db.collection('catastros').get();
    let todos = [];
    snap.forEach(doc => {
      const id = doc.id;
      const dat = doc.data();
      if (!dat || !dat.datos) return;
      Object.keys(dat.datos).forEach(k => {
        if (k.startsWith('ficha_')) {
          const resto = k.substring(6);
          const pos = resto.indexOf('_');
          const idB = resto.substring(0, pos);
          const idC = resto.substring(pos + 1);
          let nB = idB;
          if (dat.barrios) {
            const bb = dat.barrios.find(x => x.id === idB);
            if (bb) nB = bb.nombre;
          }
          const est = dat.datos['estado_' + idB + '_' + idC] || 'Pendiente';
          try {
            const integ = JSON.parse(dat.datos[k] || '[]');
            integ.forEach(p => todos.push(Object.assign({ equipo: id, barrio: nB, casa: idC, estado: est }, p)));
          } catch(e) {}
        }
      });
    });
    return todos;
  } catch(e) { toast('❌ ' + e.message, 'err'); return []; }
}

async function abrirMatriz(tipo) {
  if (!equipo) { toast('Sin equipo', 'err'); return; }
  let pac = [];
  let titulo = '';
  
  if (tipo === 'barrio') {
    if (!barrioActual) { toast('Sin barrio', 'err'); return; }
    pac = obtenerPacientesDeBarrio(barrioActual.id, barrioActual.nombre);
    titulo = '📍 ' + barrioActual.nombre + ' (' + equipo + ')';
  } else if (tipo === 'eais') {
    pac = obtenerPacientesEquipo();
    titulo = '🏥 ' + equipo;
  } else {
    pac = await obtenerPacientesTodos();
    titulo = '🌎 TODOS';
  }
  
  window._pacientesActuales = pac;
  window._tituloActual = titulo;
  
  const cont = document.getElementById('modal-contenido');
  document.getElementById('modal-titulo').innerText = titulo + ' (' + pac.length + ')';
  
  if (pac.length === 0) {
    cont.innerHTML = '<p style="text-align:center; padding:20px; color:#7f8c8d;">Sin pacientes.</p>';
  } else {
    let html = '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:11px;">' +
      '<thead><tr style="background:#2c3e50; color:white;">' +
      '<th style="padding:5px;">Casa</th><th>Nombre</th><th>Cédula</th><th>Edad</th><th>Sexo</th><th>Enfermedades</th><th>Condiciones</th></tr></thead><tbody>';
    pac.forEach(p => {
      html += '<tr style="border-bottom:1px solid #eee;">' +
        '<td style="padding:5px;"><b>' + p.casa + '</b></td>' +
        '<td>' + (p.nombre || '') + '</td>' +
        '<td>' + (p.cedula || '') + '</td>' +
        '<td>' + (p.edad || '') + '</td>' +
        '<td>' + (p.sexo || '') + '</td>' +
        '<td>' + (p.enfermedades || '') + '</td>' +
        '<td>' + ((p.condiciones || []).join(', ')) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div style="margin-top:10px;"><button class="b-verde" style="width:100%; padding:12px;" onclick="descargarExcel()">📥 Descargar Excel</button></div>';
    cont.innerHTML = html;
  }
  
  document.getElementById('modal').classList.add('abierto');
}

function descargarExcel() {
  const pac = window._pacientesActuales || [];
  if (pac.length === 0) { toast('Sin datos', 'err'); return; }
  
  const datos = pac.map(p => ({
    'EAIS': p.equipo || '',
    'Barrio': p.barrio || '',
    'Casa': p.casa,
    'Estado': p.estado || '',
    'Nombre': p.nombre || '',
    'Cédula': p.cedula || '',
    'Edad': p.edad || '',
    'Sexo': p.sexo || '',
    'Contacto': p.contacto || '',
    'Enfermedades': p.enfermedades || '',
    'Medicamentos': p.medicamentos || '',
    'Condiciones': (p.condiciones || []).join(', ')
  }));
  
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(datos);
  XLSX.utils.book_append_sheet(wb, ws, 'Pacientes');
  const fecha = new Date().toISOString().split('T')[0];
  XLSX.writeFile(wb, 'Pacientes_' + fecha + '.xlsx');
  toast('✅ Excel descargado', 'ok');
}

function exportarJSON() {
  if (!equipo) { toast('Sin equipo', 'err'); return; }
  const datos = recolectar();
  const blob = new Blob([JSON.stringify(datos)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catastro_' + equipo + '_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exportado', 'ok');
}

function importarJSON(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!confirm('¿Reemplazar datos actuales?')) { e.target.value = ''; return; }
  const r = new FileReader();
  r.onload = function(ev) {
    try {
      restaurar(JSON.parse(ev.target.result));
      toast('Importado. Recargando...', 'ok');
      setTimeout(() => location.reload(), 1000);
    } catch(err) { toast('Error: ' + err.message, 'err'); }
    e.target.value = '';
  };
  r.readAsText(f);
}

// Atajos de teclado
document.addEventListener('keydown', function(e) {
  if ((e.key === 'Delete' || e.key === 'Supr') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    const o = canvas.getActiveObject();
    if (o && o.selectable) eliminarSeleccionado();
  }
});
</script>
